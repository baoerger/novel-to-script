version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: novel-to-script-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./projects:/app/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: novel-to-script-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
